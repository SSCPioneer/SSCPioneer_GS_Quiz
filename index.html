<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6fa;font-family:Arial,Helvetica,sans-serif;color:#111}
.container{max-width:760px;margin:auto;padding:16px}
.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 3px 15px rgba(0,0,0,.08)}
.header{text-align:center;margin-bottom:18px}
.header h1{font-size:32px;margin:8px 0}
.subtitle{color:#555}
.progress{font-weight:700;font-size:18px;margin-bottom:16px}
.question{font-size:20px;line-height:1.45;margin-bottom:8px}
.hindi{font-size:18px;line-height:1.5;margin-bottom:18px}
.option{width:100%;text-align:left;background:#fff;border:2px solid #d5d9df;border-radius:13px;padding:14px 15px;margin:10px 0;font-size:17px;line-height:1.4;cursor:pointer}
.option:active{transform:scale(.99)}
.option.correct{background:#e8f7ed;border-color:#2e9d57}
.option.wrong{background:#fdeaea;border-color:#d64545}
.option.disabled{cursor:default}
.feedback{border-radius:14px;padding:15px;margin-top:16px;line-height:1.5}
.feedback.correct{background:#eaf7ee}
.feedback.wrong{background:#fdecec}
.feedback-title{font-size:20px;font-weight:700;margin-bottom:8px}
.nav{display:flex;gap:10px;margin-top:18px}
.nav button,.submit-btn,.review-btn,.start-btn{border:0;border-radius:12px;padding:13px 16px;font-size:17px;font-weight:700;cursor:pointer}
.prev{background:#e7ebf0;flex:1}
.next{background:#111;color:#fff;flex:1}
.hidden{display:none}
.palette-title{font-weight:700;font-size:18px;margin:20px 0 10px}
.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pbtn{border:2px solid #d5d9df;background:#fff;border-radius:10px;padding:11px 5px;font-weight:700;font-size:16px;cursor:pointer}
.pbtn.current{border-color:#111}
.pbtn.correct{background:#dff4e6;border-color:#2e9d57}
.pbtn.wrong{background:#fde1e1;border-color:#d64545}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:13px;color:#555}
.legend span{display:flex;align-items:center;gap:4px}
.dot{width:11px;height:11px;border-radius:3px;border:1px solid #bbb;display:inline-block}
.dot.current{background:#fff;border:2px solid #111}
.dot.correct{background:#dff4e6}
.dot.wrong{background:#fde1e1}
.result{text-align:center}
.score{font-size:42px;font-weight:800;margin:18px 0}
.start-btn,.review-btn{width:100%;background:#111;color:#fff;margin-top:12px}
.small{font-size:14px;color:#666;line-height:1.5}
@media(max-width:520px){
 .container{padding:10px}
 .card{padding:16px;border-radius:15px}
 .header h1{font-size:28px}
 .question{font-size:19px}
 .hindi{font-size:17px}
 .option{font-size:16px}
}

/* PDF / print report — compact, content-driven, page-filling SSC Pioneer solution booklet */
.pdf-report{display:none;background:#fff;color:#10213b;font-family:Arial,Helvetica,sans-serif;padding:0;line-height:1.22;font-size:9.2pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pdf-wrap{width:100%}
.pdf-page{height:283mm;display:flex;flex-direction:column;overflow:hidden;page-break-after:always;break-after:page}
.pdf-page:last-child{page-break-after:auto;break-after:auto}
.pdf-head{display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:center;margin-bottom:7px;flex:0 0 auto}
.pdf-brand{font-size:20pt;font-weight:900;letter-spacing:-.4px;color:#173f73}
.pdf-brand span{color:#c62828}
.pdf-meta{display:inline-block;margin-top:2px;background:#e9f3ff;border-radius:5px;padding:4px 8px;font-size:8.7pt;font-weight:700;color:#193b63}
.pdf-report .pdf-report-title{background:#cfe6ff;border-radius:7px;padding:9px 10px;text-align:center;font-size:12pt;font-weight:900;color:#123b6b}
.pdf-scorebar{display:grid;grid-template-columns:1.15fr 1fr;gap:7px;margin-bottom:7px;flex:0 0 auto}
.pdf-legendbox,.pdf-summarybox{border-radius:7px;padding:6px 8px;font-weight:700}
.pdf-legendbox{background:#f1f5f9;border:1px solid #dbe3ec;color:#23344b}
.pdf-summarybox{background:#fff0df;border:1px solid #ffd4a6;text-align:center}
.pdf-page-questions{display:flex;flex-direction:column;gap:7px;flex:1 1 auto;min-height:0}
.pdf-question{page-break-inside:avoid;break-inside:avoid;border:1.4px solid #b8d2ee;border-radius:10px;padding:6px 7px;margin:0;overflow:hidden;flex:1 1 0;min-height:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pdf-qhead{display:flex;justify-content:space-between;align-items:center;gap:7px;margin:-6px -7px 5px;padding:5px 7px;background:#e5f1ff;border-bottom:1px solid #c2ddf7;flex:0 0 auto;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pdf-qnum{background:#173f73;color:#fff;border-radius:7px;padding:3px 8px;font-size:11pt;font-weight:900;white-space:nowrap}
.pdf-topic{background:#d9ecff;color:#173f73;border:1px solid #a9cdef;border-radius:10px;padding:3px 7px;font-size:7.7pt;font-weight:800;white-space:nowrap}
.pdf-qtitle{font-weight:800;font-size:10.2pt;line-height:1.22;margin-bottom:3px;color:#10213b}
.pdf-question .pdf-hi{font-size:9.1pt;line-height:1.25;margin-bottom:4px;color:#17283c}
.pdf-options{display:grid;grid-template-columns:1fr 1fr;gap:3px 5px;margin-top:4px}
.pdf-option{padding:4px 5px;border:1px solid #d5dce5;border-radius:5px;background:#fff;font-size:8.4pt;line-height:1.18;min-height:29px}
.pdf-option.pdf-correct{background:#e5f7eb;border:1.4px solid #2e9d57}
.pdf-option.pdf-user-wrong{background:#fde8e8;border:1.4px solid #d64545}
.pdf-option .mark{display:inline-block;width:15px;height:15px;border-radius:50%;text-align:center;line-height:15px;font-weight:900;margin-right:3px;font-size:8pt}
.pdf-option .mark.green{background:#16824f;color:#fff}.pdf-option .mark.red{background:#d62f2f;color:#fff}
.pdf-status{font-weight:800;margin-top:4px;padding:4px 6px;border-radius:5px;font-size:8.3pt}
.pdf-status.correct{background:#dcf4e4;color:#087441}.pdf-status.wrong{background:#fde1e1;color:#b51f1f}.pdf-status.unanswered{background:#f1f3f5;color:#4b5563}
.pdf-expl{margin-top:4px;background:#eef6ff;border-left:3px solid #2386d7;border-radius:4px;padding:4px 6px;font-size:8.1pt;line-height:1.2;color:#17283c}
.pdf-expl .en{margin-bottom:3px}.pdf-expl .hi{font-size:8.15pt}
.pdf-footer{text-align:center;color:#667085;font-size:7.5pt;margin-top:4px;flex:0 0 auto}
@media print{
 body{background:#fff!important}
 .container{display:none!important}
 .pdf-report{display:block!important}
 @page{size:A4 portrait;margin:7mm}
 .pdf-page{height:283mm}
 .pdf-question{page-break-inside:avoid;break-inside:avoid}
}
button:disabled{opacity:.55;cursor:default}
</style>
</head>
<body>
<div class="container">
<div class="card">
<div id="home">
<div class="header">
<h1 id="homeTitle">📚 Quiz</h1>
<div class="subtitle" id="homeSubtitle">Loading quiz…</div>
</div>
<p id="homeText">Answer the questions at your own pace. Your progress is saved automatically on this browser.</p>
<button id="startBtn" class="start-btn" onclick="startQuiz()">START QUIZ</button>
<button id="resumeBtn" class="review-btn hidden" onclick="resumeQuiz()">RESUME QUIZ</button>
<button id="reviewHomeBtn" class="review-btn hidden" onclick="openReview()">VIEW SOLUTIONS</button>
</div>

<div id="quiz" class="hidden">
<div class="progress" id="progress"></div>
<div class="question" id="question"></div>
<div class="hindi" id="questionHi"></div>
<div id="options"></div>
<div id="feedback" class="feedback hidden"></div>

<div class="palette-title">Question Palette</div>
<div id="palette" class="palette"></div>
<div class="legend">
<span><i class="dot current"></i> Current</span>
<span><i class="dot correct"></i> Correct</span>
<span><i class="dot wrong"></i> Wrong</span>
</div>

<div class="nav">
<button class="prev" onclick="previousQuestion()">◀ Previous</button>
<button class="next" onclick="nextQuestion()">Next ▶</button>
</div>

</div>

<div id="result" class="hidden result">
<div class="header">
<h1>🎯 Quiz Result</h1>
</div>
<div class="score" id="score"></div>
<p id="resultText"></p>
<button class="review-btn" onclick="openReview()">VIEW SOLUTIONS</button>
<button class="review-btn pdf-btn" onclick="downloadPDF()">DOWNLOAD PDF</button>
<p class="small">The PDF contains all questions, your answers, correct answers and explanations.</p>
</div>
</div>
</div>

<div id="pdfReport" class="pdf-report"></div>

<script>
let quizId = "";
let quizDate = "";
let quizTitle = "";
let quizSubject = "";
let quizLanguages = "";
let questions = [];
;

let current=0;

async function loadQuiz(){
 try{
  const params=new URLSearchParams(location.search);
  const requested=params.get('date');
  const today=new Date();
  const localDate=today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,'0')+"-"+String(today.getDate()).padStart(2,'0');
  const date=(requested && /^\d{4}-\d{2}-\d{2}$/.test(requested)) ? requested : localDate;
  const res=await fetch(date+'.json?v='+Date.now(),{cache:'no-store'});
  if(!res.ok) throw new Error('Quiz not found');
  const data=await res.json();
  quizId=data.id || ('gs_daily_quiz_'+date.replaceAll('-','_'));
  quizDate=data.date || date;
  quizTitle=data.title || 'Quiz';
  quizSubject=data.subject || '';
  quizLanguages=Array.isArray(data.languages) ? data.languages.join(' + ') : (data.languages || '');
  questions=Array.isArray(data.questions)?data.questions:[];
  if(!questions.length) throw new Error('No questions');
  document.title=quizTitle+' — '+quizDate;
  document.getElementById('homeTitle').textContent=(data.icon ? data.icon+' ' : '📚 ')+quizTitle;
  const meta=[quizDate, questions.length+' Questions', quizLanguages || quizSubject].filter(Boolean);
  document.getElementById('homeSubtitle').textContent=meta.join(' • ');
  document.getElementById('startBtn').disabled=false;
  init();
 }catch(err){
  document.getElementById('homeText').textContent='This quiz is temporarily unavailable. Please try again later.';
  document.getElementById('startBtn').disabled=true;
 }
}

let answers=Array(questions.length).fill(null);
let completed=false;
let reviewMode=false;

function getSaved(){
 try{return JSON.parse(localStorage.getItem(quizId))}
 catch(e){return null}
}
function saveProgress(){
 localStorage.setItem(quizId,JSON.stringify({
  answers:answers,
  current:current,
  completed:completed,
  score:completed ? calculateScore() : null,
  updatedAt:new Date().toISOString()
 }));
}
function calculateScore(){
 return answers.reduce((n,a,i)=>n+(a!==null && a===questions[i].a?1:0),0);
}
function startQuiz(){
 const saved=getSaved();
 if(saved && saved.completed){openReview();return}
 answers=saved && Array.isArray(saved.answers) ? saved.answers : Array(questions.length).fill(null);
 current=saved && Number.isInteger(saved.current) ? saved.current : 0;
 completed=false;
 reviewMode=false;
 document.getElementById("home").classList.add("hidden");
 document.getElementById("result").classList.add("hidden");
 document.getElementById("quiz").classList.remove("hidden");
 render();
}
function resumeQuiz(){startQuiz();}

function render(){
 const x=questions[current];
 document.getElementById("progress").textContent=`Question ${current+1} / ${questions.length}`;
 document.getElementById("question").textContent=x.q;
 document.getElementById("questionHi").textContent=x.hi;

 const box=document.getElementById("options");box.innerHTML="";
 x.o.forEach((text,i)=>{
  const b=document.createElement("button");
  b.className="option";
  b.textContent=String.fromCharCode(65+i)+". "+text;
  if(answers[current]!==null){
   b.classList.add("disabled");
   if(i===x.a)b.classList.add("correct");
   if(i===answers[current] && i!==x.a)b.classList.add("wrong");
  }
  b.onclick=()=>choose(i);
  box.appendChild(b);
 });

 const f=document.getElementById("feedback");
 if(answers[current]!==null){
  f.classList.remove("hidden","correct","wrong");
  if(answers[current]===x.a){
   f.classList.add("correct");
   f.innerHTML=`<div class="feedback-title">✅ Correct!</div><b>Explanation:</b> ${x.e}<br><br>${x.eh}`;
  }else{
   f.classList.add("wrong");
   f.innerHTML=`<div class="feedback-title">❌ Wrong!</div><b>Correct answer:</b> ${String.fromCharCode(65+x.a)}. ${x.o[x.a]}<br><br><b>Explanation:</b> ${x.e}<br><br>${x.eh}`;
  }
 }else{
  f.classList.add("hidden");
 }

 buildPalette();

 const prev=document.querySelector(".prev");
 prev.disabled=current===0;
 prev.style.opacity=current===0?".5":"1";
 document.querySelector(".next").textContent =
   current===questions.length-1 ? "Finish ▶" : "Next ▶";
}

function choose(i){
 if(reviewMode || answers[current]!==null)return;
 answers[current]=i;
 saveProgress();

 // Answering Q25 completes the quiz automatically.
 if(current===questions.length-1){
  completed=true;
  saveProgress();
  showResult();
  return;
 }
 render();
}
function previousQuestion(){
 if(current>0){
  current--;
  saveProgress();
  render();
 }
}
function nextQuestion(){
 if(current<questions.length-1){
  current++;
  saveProgress();
  render();
 }
}
function jump(i){
 current=i;
 saveProgress();
 render();
}
function buildPalette(){
 const p=document.getElementById("palette");p.innerHTML="";
 questions.forEach((q,i)=>{
  const b=document.createElement("button");
  b.className="pbtn";
  b.textContent=i+1;
  if(i===current)b.classList.add("current");

  if(answers[i]!==null){
   if(answers[i]===q.a)b.classList.add("correct");
   else b.classList.add("wrong");
  }

  b.onclick=()=>jump(i);
  p.appendChild(b);
 });
}
function showResult(){
 const score=calculateScore();
 const wrong=answers.reduce((n,a,i)=>n+(a!==null && a!==questions[i].a?1:0),0);
 const unanswered=answers.filter(a=>a===null).length;

 document.getElementById("quiz").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");
 document.getElementById("score").textContent=`${score} / ${questions.length}`;
 document.getElementById("resultText").innerHTML=
  `Correct: <b>${score}</b> &nbsp;|&nbsp; Wrong: <b>${wrong}</b> &nbsp;|&nbsp; Unanswered: <b>${unanswered}</b><br><br>`+
  `Your attempt is complete on this browser.`;
}
function openReview(){
 const saved=getSaved();
 if(!saved || !saved.completed){startQuiz();return}
 answers=Array.isArray(saved.answers)?saved.answers:Array(questions.length).fill(null);
 current=0;
 completed=true;
 reviewMode=true;

 document.getElementById("home").classList.add("hidden");
 document.getElementById("result").classList.add("hidden");
 document.getElementById("quiz").classList.remove("hidden");
 render();
}

function buildPDFReport(){
 const score=calculateScore();
 const wrong=answers.reduce((n,a,i)=>n+(a!==null && a!==questions[i].a?1:0),0);
 const unanswered=answers.filter(a=>a===null).length;
 const topicColors=[
  ['#e5f1ff','#173f73','#b8d2ee'],['#e7f7ed','#087441','#a8d9bb'],['#f0eaff','#4d2a91','#cdb9ff'],
  ['#fff0df','#9a4d00','#ffd19a'],['#eaf7f5','#08756d','#a9ddd7'],['#e5f1ff','#173f73','#b8d2ee']
 ];
 const langText=quizLanguages || '';
 const meta=[quizDate, questions.length+' Questions', langText || quizSubject].filter(Boolean).join(' &nbsp; | &nbsp; ');
 const header=`<div class="pdf-head"><div><div class="pdf-brand">📚 SSC Pioneer — <span>${escapeHtml(quizTitle)}</span></div><div class="pdf-meta">${meta}</div></div><div class="pdf-report-title">Solutions &amp;<br>Performance Report</div></div>`;
 const scorebar=`<div class="pdf-scorebar"><div class="pdf-legendbox">🟢 Correct answer &nbsp; | &nbsp; 🔴 Your wrong answer &nbsp; | &nbsp; ⚪ Not answered</div><div class="pdf-summarybox"><b>Score: ${score} / ${questions.length}</b><br>Correct: ${score} &nbsp; | &nbsp; Wrong: ${wrong} &nbsp; | &nbsp; Unanswered: ${unanswered}</div></div>`;
 const cards=questions.map((x,i)=>{
   const ua=answers[i];
   const status=ua===null ? '⚪ Not Answered' : (ua===x.a?'🟢 Correct':'🔴 Wrong');
   const statusClass=ua===null?'unanswered':(ua===x.a?'correct':'wrong');
   const pal=topicColors[i%topicColors.length];
   const opts=x.o.map((text,j)=>{
     const isCorrect=j===x.a;
     const isWrong=ua!==null && ua!==x.a && j===ua;
     let cls='pdf-option'+(isCorrect?' pdf-correct':'')+(isWrong?' pdf-user-wrong':'');
     let mark=isCorrect?`<span class="mark green">✓</span>`:(isWrong?`<span class="mark red">×</span>`:'');
     return `<div class="${cls}">${mark}<b>${String.fromCharCode(65+j)}.</b> ${escapeHtml(text)}</div>`;
   }).join('');
   const your=ua===null ? 'Not answered' : `${String.fromCharCode(65+ua)}. ${x.o[ua]}`;
   const correct=`${String.fromCharCode(65+x.a)}. ${x.o[x.a]}`;
   const cardBg=statusClass==='correct'?'#effaf2':(statusClass==='wrong'?'#fff1f1':'#f7faff');
   const cardBorder=statusClass==='correct'?'#72bf91':(statusClass==='wrong'?'#e58b8b':pal[2]);
   return `<section class="pdf-question" style="border-color:${cardBorder};background:${cardBg}">`+
    `<div class="pdf-qhead" style="background:${pal[0]};border-bottom-color:${pal[2]}"><span class="pdf-qnum" style="background:${pal[1]}">Q${i+1}</span><span class="pdf-topic" style="background:${pal[0]};color:${pal[1]};border-color:${pal[2]}">Topic: ${escapeHtml(x.topic||'General')}</span></div>`+
    `<div class="pdf-qtitle">${escapeHtml(x.q||'')}</div><div class="pdf-hi" lang="hi">${escapeHtml(x.hi||'')}</div>`+
    `<div class="pdf-options">${opts}</div>`+
    `<div class="pdf-status ${statusClass}">${status} &nbsp; | &nbsp; <b>Your Answer:</b> ${escapeHtml(your)} &nbsp; | &nbsp; <b>Correct Answer:</b> ${escapeHtml(correct)}</div>`+
    `<div class="pdf-expl"><div class="en">📘 <b>Explanation:</b> ${escapeHtml(x.e||'')}</div><div class="hi" lang="hi">🔍 <b>व्याख्या:</b> ${escapeHtml(x.eh||'')}</div></div>`+
   `</section>`;
 }).join('');
 document.getElementById('pdfReport').innerHTML=`<div class="pdf-wrap">${header}${scorebar}<div id="pdfPagesHost"></div></div>`;
 const host=document.getElementById('pdfPagesHost');
 const temp=document.createElement('div');
 temp.className='pdf-page-questions';
 temp.style.position='absolute'; temp.style.left='-100000px'; temp.style.top='0'; temp.style.width='100%';
 temp.innerHTML=cards;
 document.body.appendChild(temp);
 const pageHeight=283*3.7795275591; // printable A4 height in CSS px at 96dpi
 const headerHeight=document.querySelector('#pdfReport .pdf-head').getBoundingClientRect().height;
 const scoreHeight=document.querySelector('#pdfReport .pdf-scorebar').getBoundingClientRect().height;
 const footerAllowance=18;
 const firstAvailable=Math.max(100,pageHeight-headerHeight-scoreHeight-footerAllowance);
 const laterAvailable=Math.max(100,pageHeight-footerAllowance);
 const cardEls=Array.from(temp.children);

 // First pack cards using their REAL natural heights. A card is never split.
 host.innerHTML='';
 function startPage(){
   const pg=document.createElement('div'); pg.className='pdf-page';
   if(host.children.length===0) pg.insertAdjacentHTML('beforeend',header+scorebar);
   const qw=document.createElement('div'); qw.className='pdf-page-questions';
   pg.appendChild(qw); host.appendChild(pg);
   return {pg,qw,used:0,items:[]};
 }
 let state=startPage();
 cardEls.forEach(card=>{
   const h=card.getBoundingClientRect().height;
   const gap=state.items.length ? 7 : 0;
   const limit=host.children.length===1 ? firstAvailable : laterAvailable;
   // If this card does not fit, start a new page.
   if(state.items.length && state.used+gap+h>limit) state=startPage();
   const clone=card.cloneNode(true);
   state.qw.appendChild(clone);
   state.items.push(clone);
   state.used += (state.items.length>1 ? 7 : 0) + h;
 });
 temp.remove();

 // Replace the temporary outer wrapper with the real paginated report.
 document.querySelector('#pdfReport .pdf-wrap').innerHTML=host.outerHTML;

 // IMPORTANT: use ALL remaining vertical space on every page.
 // If another whole card could not fit, the leftover space belongs to the
 // cards already on that page: enlarge those cards evenly rather than leaving
 // a large empty area at the bottom.
 document.querySelectorAll('#pdfReport .pdf-page').forEach((pg,idx)=>{
   const qw=pg.querySelector('.pdf-page-questions');
   if(!qw) return;
   const qs=Array.from(qw.children);
   if(!qs.length) return;

   const pageAvail=idx===0 ? firstAvailable : laterAvailable;
   const naturalHeights=qs.map(q=>q.getBoundingClientRect().height);
   const gaps=Math.max(0,qs.length-1)*7;
   const naturalTotal=naturalHeights.reduce((a,b)=>a+b,0)+gaps;
   const extra=Math.max(0,pageAvail-naturalTotal);

   // Give the whole leftover area to the existing cards. This is deliberately
   // not capped: a one-card page should also expand instead of looking empty.
   if(extra>0){
     const add=extra/qs.length;
     qs.forEach((q,i)=>{
       q.style.boxSizing='border-box';
       q.style.height=`${naturalHeights[i]+add}px`;
     });
   }
 });
}
function escapeHtml(v){
 return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function downloadPDF(){
 if(!completed){return}
 buildPDFReport();
 document.body.classList.add('printing');
 setTimeout(()=>{
  window.print();
  setTimeout(()=>document.body.classList.remove('printing'),500);
 },50);
}

function init(){
 const saved=getSaved();

 if(saved && saved.completed){
  document.getElementById("startBtn").classList.add("hidden");
  document.getElementById("resumeBtn").classList.add("hidden");
  document.getElementById("reviewHomeBtn").classList.remove("hidden");
  document.getElementById("homeText").textContent=
   "This quiz has already been completed on this browser. You cannot reattempt it here; you can view all questions, answers and explanations.";
 }else if(saved && Array.isArray(saved.answers) && saved.answers.some(a=>a!==null)){
  document.getElementById("startBtn").classList.add("hidden");
  document.getElementById("resumeBtn").classList.remove("hidden");
  document.getElementById("homeText").textContent=
   "You have an unfinished attempt on this browser. Your progress is saved automatically.";
 }
