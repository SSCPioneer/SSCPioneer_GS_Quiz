<!DOCTYPE html>
<html lang="en">
<head>

<title>Quiz</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6fa;font-family:Arial,Helvetica,sans-serif;color:#111}
.container{max-width:760px;margin:auto;padding:16px}
.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 3px 15px rgba(0,0,0,.08)}
.header{text-align:center;margin-bottom:18px}
.header h1{font-size:32px;margin:8px 0}
.subtitle{color:#555}
.quiz-topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;position:relative}.progress{font-weight:800;font-size:20px;margin:0}.menu-btn{width:44px;height:44px;border:0;border-radius:10px;background:#111;color:#fff;font-size:26px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}.palette-panel{margin:0 0 14px;padding:14px;background:#f8fafc;border:1px solid #d9e2ec;border-radius:14px}.palette-title{font-weight:800;font-size:18px;margin:0 0 10px}.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.palette-actions{display:flex;gap:8px;margin-top:12px}.palette-actions button{flex:1;border:0;border-radius:10px;padding:10px;font-size:15px;font-weight:700;cursor:pointer}.palette-actions .finish-menu{background:#111;color:#fff}.palette-panel .legend{margin-top:10px}
.instruction{font-size:18px;line-height:1.45;font-weight:800;margin-bottom:8px}
.question{font-size:20px;line-height:1.45;margin-bottom:10px}.jumble-line{margin:0 0 10px}.jumble-line:last-child{margin-bottom:0}
.matching-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px 22px;margin:8px 0 10px;padding:10px 12px;background:#f8fafc;border:1px solid #d9e2ec;border-radius:10px}.matching-row{display:grid;grid-template-columns:34px 1fr;gap:6px;align-items:start;line-height:1.4}.matching-row b{font-weight:900}.matching-right{font-weight:700}.matching-prompt{margin-bottom:8px}

.pbtn{border:2px solid #d5d9df;background:#fff;border-radius:10px;padding:11px 5px;font-weight:700;font-size:16px;cursor:pointer}

@media(max-width:520px){
 .container{padding:10px}
 .card{padding:16px;border-radius:15px}
 .header h1{font-size:28px}
 .question{font-size:19px}

 .question-passage{font-size:16px}

}

/* PDF / print report — colorful SSC Pioneer solution booklet */

.pdf-wrap{width:100%}
.pdf-head{display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:center;margin-bottom:7px}
.pdf-brand{font-size:20pt;font-weight:900;letter-spacing:-.4px;color:#173f73}
.pdf-brand span{color:#c62828}
.pdf-meta{display:inline-block;margin-top:2px;background:#e9f3ff;border-radius:5px;padding:4px 8px;font-size:8.7pt;font-weight:700;color:#193b63}
.pdf-report .pdf-report-title{background:#cfe6ff;border-radius:7px;padding:9px 10px;text-align:center;font-size:12pt;font-weight:900;color:#123b6b}

.pdf-summarybox{background:#fff0df;border:1px solid #ffd4a6;text-align:center}
.pdf-question{page-break-inside:avoid;break-inside:avoid;display:block;border:1.4px solid #b8d2ee;border-radius:10px;padding:6px 7px;margin:0 0 7px;background:#f8fbff;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pdf-qhead{display:flex;justify-content:space-between;align-items:center;gap:7px;margin:-6px -7px 5px;padding:5px 7px;background:#e5f1ff;border-bottom:1px solid #c2ddf7;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pdf-qnum{background:#173f73;color:#fff;border-radius:7px;padding:3px 8px;font-size:11pt;font-weight:900;white-space:nowrap}
.pdf-topic{background:#d9ecff;color:#173f73;border:1px solid #a9cdef;border-radius:10px;padding:3px 7px;font-size:7.7pt;font-weight:800;white-space:nowrap}
.pdf-instruction{font-weight:900;font-size:9.6pt;line-height:1.22;margin:2px 0 4px;color:#10213b}
.pdf-qtitle{font-weight:800;font-size:10.2pt;line-height:1.22;margin-bottom:4px;color:#10213b}
.pdf-passage{background:#f5f8fc;border:1px solid #d9e2ec;border-radius:5px;padding:4px 6px;margin:4px 0 5px;font-size:8.2pt;line-height:1.25}
.pdf-expl .ex-heading{font-weight:900;font-size:8.6pt;margin-top:4px;margin-bottom:2px}.pdf-expl .ex-text{margin-bottom:3px}.pdf-expl .ex-option{margin:3px 0;padding:3px 4px;background:#fff;border:1px solid #d9e2ec;border-radius:3px;line-height:1.18}.pdf-expl .ex-vocab{margin-top:4px;padding-top:4px;border-top:1px solid #cdd8e3}.pdf-expl .ex-list{margin:2px 0 2px 15px;line-height:1.2}
.pdf-question .pdf-hi{font-size:9.1pt;line-height:1.25;margin-bottom:4px;color:#17283c}
.pdf-options{display:grid;grid-template-columns:1fr 1fr;gap:3px 5px;margin-top:4px}
.pdf-matching-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px 18px;margin:4px 0 5px;padding:4px 6px;background:#f8fafc;border:1px solid #d9e2ec;border-radius:5px}.pdf-matching-row{display:grid;grid-template-columns:22px 1fr;gap:4px;line-height:1.18}.pdf-matching-row b{font-weight:900}.pdf-matching-right{font-weight:700}
.pdf-option{padding:4px 5px;border:1px solid #d5dce5;border-radius:5px;background:#fff;font-size:8.4pt;line-height:1.18;min-height:29px}
.pdf-option.pdf-correct{background:#e5f7eb;border:1.4px solid #2e9d57}
.pdf-option.pdf-user-wrong{background:#fde8e8;border:1.4px solid #d64545}
.pdf-option .mark{display:inline-block;width:15px;height:15px;border-radius:50%;text-align:center;line-height:15px;font-weight:900;margin-right:3px;font-size:8pt}
.pdf-option .mark.green{background:#16824f;color:#fff}.pdf-option .mark.red{background:#d62f2f;color:#fff}
.pdf-status{font-weight:800;margin-top:4px;padding:4px 6px;border-radius:5px;font-size:8.3pt}
.pdf-status.correct{background:#dcf4e4;color:#087441}.pdf-status.wrong{background:#fde1e1;color:#b51f1f}.pdf-status.unanswered{background:#f1f3f5;color:#4b5563}
.pdf-expl{margin-top:4px;background:#eef6ff;border-left:3px solid #2386d7;border-radius:4px;padding:4px 6px;font-size:8.1pt;line-height:1.2;color:#17283c}
.pdf-expl .en{margin-bottom:3px}.pdf-expl .hi{font-size:8.15pt}
.pdf-footer{text-align:center;color:#667085;font-size:7.5pt;margin-top:4px}
@media print{
 body{background:#fff!important}
 .container{display:none!important}
 .pdf-report{display:block!important}
 @page{size:A4 portrait;margin:7mm}
.pdf-page{display:block;page-break-inside:avoid;break-inside:avoid;}
 .pdf-question{page-break-inside:avoid;break-inside:avoid}
}
button:disabled{opacity:.55;cursor:default}
@media print{.pdf-report{font-size:9pt}}\n</style>

<body>
<div class="container">
<div class="card">
<div id="home">
<div class="header">
<h1 id="quizTitle">📚 Quiz</h1>
<div class="subtitle" id="quizSubtitle">Loading quiz…</div>
</div>
<p id="homeText">Answer the questions at your own pace. Your progress is saved automatically on this browser.</p>
<button id="startBtn" class="start-btn" onclick="startQuiz()">START QUIZ</button>
<button id="resumeBtn" class="review-btn hidden" onclick="resumeQuiz()">RESUME QUIZ</button>
<button id="reviewHomeBtn" class="review-btn hidden" onclick="openReview()">VIEW SOLUTIONS</button>
</div>

<div id="quiz" class="hidden">
<div class="quiz-topbar">
  <div class="progress" id="progress"></div>
  <button class="menu-btn" id="paletteToggle" onclick="togglePalette()" aria-label="Open question palette" aria-expanded="false">☰</button>
</div>

<div id="palettePanel" class="palette-panel hidden">
  <div class="palette-title">Question Palette</div>
  <div id="palette" class="palette"></div>
  <div class="legend">
    <span><i class="dot current"></i> Current</span>
    <span><i class="dot correct"></i> Correct</span>
    <span><i class="dot wrong"></i> Wrong</span>
  </div>
  <div class="palette-actions">
    <button onclick="previousQuestion();closePalette()">◀ Previous</button>
    <button onclick="nextQuestion();closePalette()">Next ▶</button>
    <button class="finish-menu" onclick="finishQuiz();closePalette()">Finish</button>
  </div>
</div>

<div class="instruction" id="instruction"></div>
<div class="question-passage hidden" id="questionPassage"></div>
<div class="question" id="question"></div>
<div class="hindi" id="questionHi"></div>
<div id="options"></div>

<div class="nav">
<button class="prev" onclick="previousQuestion()">◀ Previous</button>
<button class="next" onclick="nextQuestion()">Next ▶</button>
</div>

<div id="feedback" class="feedback hidden"></div>

</div>

<div id="result" class="hidden result">
<div class="header">
<h1>🎯 Quiz Result</h1>
</div>
<div class="score" id="score"></div>
<p id="resultText"></p>
<button class="review-btn" onclick="openReview()">VIEW SOLUTIONS</button>
<button class="review-btn pdf-btn" onclick="downloadPDF()">DOWNLOAD PDF</button>
<p class="small">The PDF contains all questions, your answers, correct answers and explanations.</p>
</div>
</div>
</div>

<div id="pdfReport" class="pdf-report"></div>

<script>
let quizId = "";
let quizDate = "";
let quizTitle = "";
let quizSubject = "";
let quizLanguages = [];
let questions = [];
let current = 0;
let answers = [];
let completed = false;
let reviewMode = false;

function esc(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function getOptionText(q, i){
  return Array.isArray(q.o) && q.o[i] !== undefined ? q.o[i] : "";
}

function labelForIndex(i){
  return i < 26 ? String.fromCharCode(65+i) : String(i+1);
}

function languageLine(data){
  if (Array.isArray(data.languages) && data.languages.length) return data.languages.join(" + ");
  const hasHindi = questions.some(q => q.hi);
  return hasHindi ? "English + Hindi" : "English";
}

async function loadQuiz(){
  try{
    const params = new URLSearchParams(location.search);
    const requestedFile = params.get("file");
    const requestedDate = params.get("date");
    const requestedSubject = params.get("subject");
    const requestedSet = params.get("set");

    const today = new Date();
    const localDate =
      today.getFullYear()+"-"+
      String(today.getMonth()+1).padStart(2,"0")+"-"+
      String(today.getDate()).padStart(2,"0");

    const date = requestedDate && /^\d{4}-\d{2}-\d{2}$/.test(requestedDate)
      ? requestedDate : localDate;

    // Supports all four subjects and any number of daily sets.
    // Preferred root-level filename:
    // YYYY-MM-DD-Subject-Set-N.json
    const safeSubject = requestedSubject
      ? requestedSubject.replace(/[^A-Za-z0-9_-]/g,"")
      : "";
    const safeSet = requestedSet && /^\d+$/.test(requestedSet)
      ? requestedSet : "";

    const candidates = [];
    if(requestedFile && /^[A-Za-z0-9._-]+\.json$/.test(requestedFile)){
      candidates.push(requestedFile);
    }
    if(safeSubject && safeSet){
      candidates.push(`${date}-${safeSubject}-Set-${safeSet}.json`);
    }
    if(safeSubject){
      candidates.push(`${date}-${safeSubject}.json`);
    }
    candidates.push(`${date}.json`);

    let data = null;
    for(const file of candidates){
      try{
        const res = await fetch(file+"?v="+Date.now(), {cache:"no-store"});
        if(res.ok){
          data = await res.json();
          break;
        }
      }catch(e){}
    }
    if(!data) throw new Error("Quiz not found");
    questions = Array.isArray(data.questions) ? data.questions : [];
    if(!questions.length) throw new Error("No questions");

    quizId = data.id || ("quiz_"+date.replaceAll("-","_"));
    quizDate = data.date || date;
    quizTitle = data.title || data.subject || "Quiz";
    quizSubject = data.subject || "";
    quizLanguages = Array.isArray(data.languages) ? data.languages : [];

    answers = Array(questions.length).fill(null);

    document.title = quizTitle + " — " + quizDate;
    document.getElementById("quizTitle").textContent = "📚 " + quizTitle;
    document.getElementById("quizSubtitle").textContent =
      quizDate + " • " + questions.length + " Questions" +
      (languageLine(data) ? " • " + languageLine(data) : "");
    const pdfBrandTitle = document.getElementById("pdfBrandTitle"); if(pdfBrandTitle) pdfBrandTitle.textContent = quizTitle;

    const desc = data.description || "Answer the questions at your own pace. Your progress is saved automatically on this browser.";
    document.getElementById("homeText").textContent = desc;

    document.getElementById("startBtn").disabled = false;
    init();
  }catch(err){
    document.getElementById("homeText").textContent =
      "This quiz is temporarily unavailable. Please check the quiz link or try again later.";
    document.getElementById("startBtn").disabled = true;
  }
}

function getSaved(){
  try { return JSON.parse(localStorage.getItem(quizId)); }
  catch(e) { return null; }
}

function saveProgress(){
  try{
    localStorage.setItem(quizId, JSON.stringify({
      answers, current, completed,
      score: completed ? calculateScore() : null,
      updatedAt: new Date().toISOString()
    }));
  }catch(e){}
}

function calculateScore(){
  return answers.reduce((n,a,i) =>
    n + (a !== null && a === questions[i].a ? 1 : 0), 0);
}

function startQuiz(){
  const saved = getSaved();
  if(saved && saved.completed){ openReview(); return; }

  answers = saved && Array.isArray(saved.answers) &&
            saved.answers.length === questions.length
    ? saved.answers : Array(questions.length).fill(null);

  current = saved && Number.isInteger(saved.current)
    ? Math.min(Math.max(saved.current,0), questions.length-1) : 0;

  completed = false;
  reviewMode = false;
  document.getElementById("home").classList.add("hidden");
  document.getElementById("result").classList.add("hidden");
  document.getElementById("quiz").classList.remove("hidden");
  render();
}

function resumeQuiz(){ startQuiz(); }

function subjectIs(name){
  const s=String(quizSubject||'').toLowerCase().replace(/[^a-z]/g,'');
  return name==='math' ? (s.includes('math')) : name==='reasoning' ? (s.includes('reason')) : name==='gs' ? (s==='gs'||s.includes('generalstud')) : name==='english' ? s.includes('english') : false;
}

function getSolutionParts(x){
  const en = x.solution ?? x.solutionEnglish ?? x.solution_en ?? x.se ?? x.sol ?? x.solutionText;
  const hi = x.solutionHindi ?? x.solution_hindi ?? x.solution_hi ?? x.sh ?? x.sol_hi;
  return {en,hi};
}

function parseMatching(text){
  const raw=String(text||'').replace(/\r/g,'').split('\n').map(v=>v.trim()).filter(v=>v!=='');
  const left=[], right=[], prompt=[]; let side='prompt';
  raw.forEach(line=>{
    const mLeft=line.match(/^([A-D])\.\s*(.+)$/i);
    const mRight=line.match(/^([1-9][0-9]?)\.\s*(.+)$/);
    if(side==='prompt' && mLeft){side='left'; left.push({label:mLeft[1].toUpperCase(),text:mLeft[2]});return;}
    if(side==='left' && mRight){side='right'; right.push({label:mRight[1],text:mRight[2]});return;}
    if(side==='left' && mLeft){left.push({label:mLeft[1].toUpperCase(),text:mLeft[2]});return;}
    if(side==='right' && mRight){right.push({label:mRight[1],text:mRight[2]});return;}
    if(side==='prompt') prompt.push(line);
  });
  return (left.length && right.length) ? {prompt,left,right} : null;
}

function matchingHTML(text, pdf=false){
  const m=parseMatching(text);
  if(!m) return null;
  const cls=pdf?'pdf-matching-grid':'matching-grid', row=pdf?'pdf-matching-row':'matching-row', rcls=pdf?'pdf-matching-right':'matching-right';
  let h='';
  if(m.prompt.length) h+='<div class="matching-prompt">'+m.prompt.map(esc).join('<br>')+'</div>';
  h+='<div class="'+cls+'">';
  const n=Math.max(m.left.length,m.right.length);
  for(let i=0;i<n;i++){
    const l=m.left[i], r=m.right[i];
    h+='<div class="'+row+'"><b>'+esc(l?l.label:'')+(l?'.':'')+'</b><span>'+esc(l?l.text:'')+'</span></div>';
    h+='<div class="'+row+'"><b>'+esc(r?r.label:'')+(r?'.':'')+'</b><span class="'+rcls+'">'+esc(r?r.text:'')+'</span></div>';
  }
  h+='</div>';
  return h;
}

function explanationHTML(x){
  let h='<div class="explanation">';
  // Math and Reasoning have their own simple two-part solution format. English is untouched.
  if(subjectIs('math') || subjectIs('reasoning')){
    const correctLabel=labelForIndex(x.a), correctText=getOptionText(x,x.a);
    h+='<div class="ex-block"><div class="ex-heading">Correct Answer</div><div class="ex-text"><b>'+esc(correctLabel)+'.</b> '+esc(correctText)+'</div></div>';
    const parts=getSolutionParts(x);
    if(parts.en) h+='<div class="ex-block"><div class="ex-text">'+esc(parts.en)+'</div></div>';
    if(parts.hi) h+='<div class="ex-block"><div class="ex-text" lang="hi">'+esc(parts.hi)+'</div></div>';
    h+='</div>';
    return h;
  }
  const ex=x.explanation||{};
  const correctLabel=labelForIndex(x.a);
  const correctText=getOptionText(x,x.a);

  h+='<div class="ex-block"><div class="ex-heading">Correct Answer</div><div class="ex-text"><b>'+esc(correctLabel)+'.</b> '+esc(correctText)+'</div></div>';

  if(ex.vocabulary){
    const v=ex.vocabulary;
    h+='<div class="ex-vocab">';
    h+='<div class="ex-text"><b>Meaning:</b> '+esc(v.meaning)+'</div>';
    h+='<div class="ex-text"><b>Hindi Meaning:</b> '+esc(v.hindi_meaning)+'</div>';
    h+='<div class="ex-text"><b>Syn:</b> '+v.synonyms.map(esc).join(', ')+'</div>';
    h+='<div class="ex-text"><b>Ant:</b> '+v.antonyms.map(esc).join(', ')+'</div>';
    const opts=ex.options||{};
    ['A','B','C','D'].forEach(L=>{
      if(L===correctLabel || !opts[L]) return;
      h+='<div class="ex-option"><b>'+L+'. '+esc(opts[L].word)+'</b> — '+esc(opts[L].meaning)+'<br><span>Hindi: '+esc(opts[L].hindi)+'</span></div>';
    });
    h+='</div>';
  } else if(ex.correct_meaning){
    h+='<div class="ex-vocab">';
    h+='<div class="ex-text"><b>Meaning:</b> '+esc(ex.correct_meaning.meaning)+'</div>';
    h+='<div class="ex-text"><b>Hindi Meaning:</b> '+esc(ex.correct_meaning.hindi)+'</div>';
    const opts=ex.options||{};
    ['A','B','C','D'].forEach(L=>{
      if(L===correctLabel || !opts[L]) return;
      h+='<div class="ex-option"><b>'+L+'. '+esc(opts[L].word)+'</b> — '+esc(opts[L].meaning)+'<br><span>Hindi: '+esc(opts[L].hindi)+'</span></div>';
    });
    h+='</div>';
  } else if(ex.explanation || ex.hindi) {
    if(ex.explanation) h+='<div class="ex-block"><div class="ex-heading">Explanation</div><div class="ex-text">'+esc(ex.explanation)+'</div></div>';
    if(ex.hindi) h+='<div class="ex-block"><div class="ex-heading">Hindi</div><div class="ex-text" lang="hi">'+esc(ex.hindi)+'</div></div>';
  } else {
    // GS-format fallback: keep GS independent from English's explanation object.
    if(x.e) h+='<div class="ex-block"><div class="ex-text">'+esc(x.e)+'</div></div>';
    if(x.eh) h+='<div class="ex-block"><div class="ex-text" lang="hi">'+esc(x.eh)+'</div></div>';
    const facts = x.extraFacts || x.extra_facts || x.facts;
    if(Array.isArray(facts) && facts.length){
      h+='<div class="ex-block"><div class="ex-heading">Extra Facts</div><div class="ex-text">'+facts.map(f=>'• '+esc(f)).join('<br>')+'</div></div>';
    } else if(typeof facts === 'string' && facts.trim()){
      h+='<div class="ex-block"><div class="ex-heading">Extra Facts</div><div class="ex-text">'+esc(facts)+'</div></div>';
    }
  }
  h+='</div>';
  return h;
}
function render(){
  const x = questions[current];
  document.getElementById("progress").textContent = `Question ${current+1} / ${questions.length}`;

  const ins=document.getElementById("instruction");
  ins.textContent=x.instruction || "";
  ins.classList.toggle("hidden",!x.instruction);

  const qEl=document.getElementById("question");
  if(Array.isArray(x.sentences) && x.sentences.length){
    qEl.innerHTML=x.sentences.map(s=>'<div class="jumble-line"><b>'+esc(s.label)+':</b> '+esc(s.text)+'</div>').join('');
    qEl.classList.remove("hidden");
  }else{
    const matching=matchingHTML(x.q||'',false);
    if(matching){ qEl.innerHTML=matching; qEl.classList.remove("hidden"); }
    else { qEl.textContent=x.q || ""; qEl.classList.toggle("hidden",!x.q); }
  }

  const pEl=document.getElementById("questionPassage");
  if(x.passage){ pEl.textContent=x.passage; pEl.classList.remove("hidden"); }
  else { pEl.textContent=""; pEl.classList.add("hidden"); }

  const hi = document.getElementById("questionHi");
  hi.textContent = x.hi || "";
  hi.classList.toggle("hidden", !x.hi);

  const box = document.getElementById("options"); box.innerHTML = "";
  (Array.isArray(x.o) ? x.o : []).forEach((text,i)=>{
    const b=document.createElement("button"); b.className="option";
    b.textContent=labelForIndex(i)+". "+text;
    if(answers[current]!==null){
      b.classList.add("disabled");
      if(i===x.a) b.classList.add("correct");
      if(i===answers[current] && i!==x.a) b.classList.add("wrong");
    }
    b.onclick=()=>choose(i); box.appendChild(b);
  });

  const f=document.getElementById("feedback");
  if(answers[current]!==null || reviewMode){
    f.classList.remove("hidden","correct","wrong");
    if(answers[current]===null){
      f.innerHTML='<div class="feedback-title">⏭️ Unanswered</div>'+explanationHTML(x);
    } else if(answers[current]===x.a){
      f.classList.add("correct");
      f.innerHTML='<div class="feedback-title">✅ Correct!</div>'+explanationHTML(x);
    }else{
      f.classList.add("wrong");
      f.innerHTML='<div class="feedback-title">❌ Wrong!</div>'+explanationHTML(x);
    }
  }else f.classList.add("hidden");

  buildPalette();
  const prev=document.querySelector(".prev"); prev.disabled=current===0; prev.style.opacity=current===0?".5":"1";
  document.querySelector(".next").textContent=current===questions.length-1?"Finish ▶":"Next ▶";
}
function choose(i){
  if(reviewMode || answers[current] !== null) return;

  answers[current] = i;
  saveProgress();

  if(current === questions.length-1){
    completed = true;
    saveProgress();
    showResult();
    return;
  }
  render();
}

function previousQuestion(){
  if(current > 0){
    current--;
    saveProgress();
    render();
  }
}

function nextQuestion(){
  if(current < questions.length-1){
    current++;
    saveProgress();
    render();
  }else{
    completed = true;
    saveProgress();
    showResult();
  }
}

function jump(i){
  current = i;
  saveProgress();
  render();
}

function togglePalette(){
  const panel=document.getElementById("palettePanel");
  const btn=document.getElementById("paletteToggle");
  const isOpen=!panel.classList.contains("hidden");
  panel.classList.toggle("hidden",isOpen);
  btn.setAttribute("aria-expanded",String(!isOpen));
}

function closePalette(){
  const panel=document.getElementById("palettePanel");
  const btn=document.getElementById("paletteToggle");
  panel.classList.add("hidden");
  btn.setAttribute("aria-expanded","false");
}

function finishQuiz(){
  completed=true;
  saveProgress();
  showResult();
}

function buildPalette(){
  const p = document.getElementById("palette");
  p.innerHTML = "";
  questions.forEach((q,i)=>{
    const b = document.createElement("button");
    b.className = "pbtn";
    b.textContent = i+1;
    if(i === current) b.classList.add("current");

    if(answers[i] !== null){
      if(answers[i] === q.a) b.classList.add("correct");
      else b.classList.add("wrong");
    }
    b.onclick = () => jump(i);
    p.appendChild(b);
  });
}

function showResult(){
  const score = calculateScore();
  const wrong = answers.reduce((n,a,i) =>
    n + (a !== null && a !== questions[i].a ? 1 : 0), 0);
  const unanswered = answers.filter(a => a === null).length;

  document.getElementById("quiz").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");
  document.getElementById("score").textContent =
    `${score} / ${questions.length}`;
  document.getElementById("resultText").innerHTML =
    `Correct: <b>${score}</b> &nbsp;|&nbsp; Wrong: <b>${wrong}</b> &nbsp;|&nbsp; Unanswered: <b>${unanswered}</b><br><br>` +
    `Your attempt is complete on this browser.`;
}

function openReview(){
  const saved = getSaved();
  if(!saved || !saved.completed){ startQuiz(); return; }

  answers = Array.isArray(saved.answers) &&
            saved.answers.length === questions.length
    ? saved.answers : Array(questions.length).fill(null);
  current = 0;
  completed = true;
  reviewMode = true;

  document.getElementById("home").classList.add("hidden");
  document.getElementById("result").classList.add("hidden");
  document.getElementById("quiz").classList.remove("hidden");
  render();
}

function pdfExplanationHTML(x){
  const ex=x.explanation||{}; let h='';
  const correctLabel=labelForIndex(x.a), correctText=getOptionText(x,x.a);
  h+='<div class="ex-heading">Correct Answer</div><div class="ex-text"><b>'+esc(correctLabel)+'.</b> '+esc(correctText)+'</div>';
  if(subjectIs('math') || subjectIs('reasoning')){
    const parts=getSolutionParts(x);
    if(parts.en) h+='<div class="ex-text">'+esc(parts.en)+'</div>';
    if(parts.hi) h+='<div class="ex-text" lang="hi">'+esc(parts.hi)+'</div>';
    return h;
  }
  if(ex.vocabulary){
    const v=ex.vocabulary;
    h+='<div class="ex-text"><b>Meaning:</b> '+esc(v.meaning)+'</div>';
    h+='<div class="ex-text"><b>Hindi Meaning:</b> '+esc(v.hindi_meaning)+'</div>';
    h+='<div class="ex-text"><b>Syn:</b> '+v.synonyms.map(esc).join(', ')+'</div>';
    h+='<div class="ex-text"><b>Ant:</b> '+v.antonyms.map(esc).join(', ')+'</div>';
    const opts=ex.options||{};
    ['A','B','C','D'].forEach(L=>{if(L===correctLabel||!opts[L])return; h+='<div class="ex-option"><b>'+L+'. '+esc(opts[L].word)+'</b> — '+esc(opts[L].meaning)+'<br>Hindi: '+esc(opts[L].hindi)+'</div>';});
  } else if(ex.correct_meaning){
    h+='<div class="ex-text"><b>Meaning:</b> '+esc(ex.correct_meaning.meaning)+'</div>';
    h+='<div class="ex-text"><b>Hindi Meaning:</b> '+esc(ex.correct_meaning.hindi)+'</div>';
    const opts=ex.options||{};
    ['A','B','C','D'].forEach(L=>{if(L===correctLabel||!opts[L])return; h+='<div class="ex-option"><b>'+L+'. '+esc(opts[L].word)+'</b> — '+esc(opts[L].meaning)+'<br>Hindi: '+esc(opts[L].hindi)+'</div>';});
  } else {
    if(ex.explanation) h+='<div class="ex-heading">Explanation</div><div class="ex-text">'+esc(ex.explanation)+'</div>';
    if(ex.hindi) h+='<div class="ex-heading">Hindi</div><div class="ex-text" lang="hi">'+esc(ex.hindi)+'</div>';
    if(subjectIs('gs') || x.e !== undefined || x.eh !== undefined){
      if(x.e) h+='<div class="ex-text">'+esc(x.e)+'</div>';
      if(x.eh) h+='<div class="ex-text" lang="hi">'+esc(x.eh)+'</div>';
      const facts=x.extraFacts||x.extra_facts||x.facts;
      if(Array.isArray(facts)&&facts.length) h+='<div class="ex-heading">Extra Facts</div><div class="ex-text">'+facts.map(f=>'• '+esc(f)).join('<br>')+'</div>';
      else if(typeof facts==='string'&&facts.trim()) h+='<div class="ex-heading">Extra Facts</div><div class="ex-text">'+esc(facts)+'</div>';
    }
  }
  return h;
}
function buildPDFReport(){
  const score=calculateScore();
  const wrong=answers.reduce((n,a,i)=>n+(a!==null&&a!==questions[i].a?1:0),0);
  const unanswered=answers.filter(a=>a===null).length;
  let html='<div class="pdf-wrap">';
  html+='<div class="pdf-head"><div><div class="pdf-brand">📚 SSC Pioneer — <span>'+esc(quizTitle)+'</span></div><div class="pdf-meta">'+esc(quizDate)+' &nbsp; | &nbsp; '+questions.length+' Questions &nbsp; | &nbsp; '+esc(quizLanguages.length?quizLanguages.join(' + '):(questions.some(q=>q.hi)?'English + Hindi':'English'))+'</div></div><div class="pdf-report-title">Solutions &amp;<br>Performance Report</div></div>';
  html+='<div class="pdf-scorebar"><div class="pdf-legendbox">🟢 Correct answer &nbsp; | &nbsp; 🔴 Your wrong answer &nbsp; | &nbsp; 🔵 Not answered</div><div class="pdf-summarybox"><b>Score: '+score+' / '+questions.length+'</b><br>Correct: '+score+' &nbsp; | &nbsp; Wrong: '+wrong+' &nbsp; | &nbsp; Unanswered: '+unanswered+'</div></div>';

  questions.forEach((x,i)=>{
    const ua=answers[i], status=ua===null?'🔵 Not Answered':(ua===x.a?'🟢 Correct':'🔴 Wrong');
    const statusClass=ua===null?'unanswered':(ua===x.a?'correct':'wrong');
    const cardBg=statusClass==='correct'?'#effaf2':(statusClass==='wrong'?'#fff1f1':'#f2f7ff');
    const cardBorder=statusClass==='correct'?'#72bf91':(statusClass==='wrong'?'#e58b8b':'#72a9df');
    const headBg=statusClass==='correct'?'#dcf4e4':(statusClass==='wrong'?'#fde1e1':'#e3f0ff');
    const headColor=statusClass==='correct'?'#087441':(statusClass==='wrong'?'#b51f1f':'#173f73');
    const opts=(Array.isArray(x.o)?x.o:[]).map((text,j)=>{
      const isCorrect=j===x.a, isWrong=ua!==null&&ua!==x.a&&j===ua;
      let cls='pdf-option'+(isCorrect?' pdf-correct':'')+(isWrong?' pdf-user-wrong':'');
      let mark=isCorrect?'<span class="mark green">✓</span>':(isWrong?'<span class="mark red">×</span>':'');
      return '<div class="'+cls+'">'+mark+'<b>'+esc(labelForIndex(j))+'.</b> '+esc(text)+'</div>';
    }).join('');
    const your=ua===null?'Not answered':labelForIndex(ua)+'. '+getOptionText(x,ua);
    const correct=labelForIndex(x.a)+'. '+getOptionText(x,x.a);
    html+='<section class="pdf-question" data-q="'+i+'" style="border-color:'+cardBorder+';background:'+cardBg+'">';
    html+='<div class="pdf-qhead" style="background:'+headBg+';border-bottom-color:'+cardBorder+'"><span class="pdf-qnum" style="background:'+headColor+'">Q'+(i+1)+'</span><span class="pdf-topic" style="background:'+headBg+';color:'+headColor+';border-color:'+cardBorder+'">Topic: '+esc(x.topic||quizSubject||'General')+'</span></div>';
    if(x.instruction) html+='<div class="pdf-instruction">'+esc(x.instruction)+'</div>';
    if(x.passage) html+='<div class="pdf-passage">'+esc(x.passage)+'</div>';
    if(Array.isArray(x.sentences) && x.sentences.length){
      html+='<div class="pdf-qtitle pdf-jumbles">'+x.sentences.map(s=>'<div><b>'+esc(s.label)+':</b> '+esc(s.text)+'</div>').join('')+'</div>';
    }else{
      const matching=matchingHTML(x.q||'',true);
      html+=matching?'<div class="pdf-qtitle">'+matching+'</div>':'<div class="pdf-qtitle">'+esc(x.q||'')+'</div>';
    }
    if(x.hi) html+='<div class="pdf-hi" lang="hi">'+esc(x.hi)+'</div>';
    html+='<div class="pdf-options">'+opts+'</div>';
    html+='<div class="pdf-status '+statusClass+'">'+status+' &nbsp; | &nbsp; <b>Your Answer:</b> '+esc(your)+' &nbsp; | &nbsp; <b>Correct Answer:</b> '+esc(correct)+'</div>';
    html+='<div class="pdf-expl">'+pdfExplanationHTML(x)+'</div>';
    html+='</section>';
  });

  html+='<div class="pdf-footer">SSC Pioneer • '+esc(quizTitle)+' • Solutions &amp; Performance Report</div></div>';
  const report=document.getElementById('pdfReport');
  report.innerHTML=html;
}
function downloadPDF(){
  if(!completed) return;
  buildPDFReport();
  document.body.classList.add("printing");
  setTimeout(()=>{
    window.print();
    setTimeout(()=>document.body.classList.remove("printing"),500);
  },50);
}

function init(){
  const saved = getSaved();

  if(saved && saved.completed){
    document.getElementById("startBtn").classList.add("hidden");
    document.getElementById("resumeBtn").classList.add("hidden");
    document.getElementById("reviewHomeBtn").classList.remove("hidden");
    document.getElementById("homeText").textContent =
      "This quiz has already been completed on this browser. You cannot reattempt it here; you can view all questions, answers and explanations.";
  }else if(saved && Array.isArray(saved.answers) &&
           saved.answers.some(a => a !== null)){
    document.getElementById("startBtn").classList.add("hidden");
    document.getElementById("resumeBtn").classList.remove("hidden");
    document.getElementById("homeText").textContent =
      "You have an unfinished attempt on this browser. Your progress is saved automatically.";
  }
}

loadQuiz();
</script>
