<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6fa;font-family:Arial,Helvetica,sans-serif;color:#111}
.container{max-width:760px;margin:auto;padding:16px}
.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 3px 15px rgba(0,0,0,.08)}
.header{text-align:center;margin-bottom:18px}
.header h1{font-size:32px;margin:8px 0}
.subtitle{color:#555}
.progress{font-weight:700;font-size:18px;margin-bottom:16px}
.question{font-size:20px;line-height:1.45;margin-bottom:8px}
.hindi{font-size:18px;line-height:1.5;margin-bottom:18px}
.option{width:100%;text-align:left;background:#fff;border:2px solid #d5d9df;border-radius:13px;padding:14px 15px;margin:10px 0;font-size:17px;line-height:1.4;cursor:pointer}
.option:active{transform:scale(.99)}
.option.correct{background:#e8f7ed;border-color:#2e9d57}
.option.wrong{background:#fdeaea;border-color:#d64545}
.option.disabled{cursor:default}
.feedback{border-radius:14px;padding:15px;margin-top:16px;line-height:1.5}
.feedback.correct{background:#eaf7ee}
.feedback.wrong{background:#fdecec}
.feedback-title{font-size:20px;font-weight:700;margin-bottom:8px}
.nav{display:flex;gap:10px;margin-top:18px}
.nav button,.submit-btn,.review-btn,.start-btn{border:0;border-radius:12px;padding:13px 16px;font-size:17px;font-weight:700;cursor:pointer}
.prev{background:#e7ebf0;flex:1}
.next{background:#111;color:#fff;flex:1}
.hidden{display:none}
.palette-title{font-weight:700;font-size:18px;margin:20px 0 10px}
.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pbtn{border:2px solid #d5d9df;background:#fff;border-radius:10px;padding:11px 5px;font-weight:700;font-size:16px;cursor:pointer}
.pbtn.current{border-color:#111}
.pbtn.correct{background:#dff4e6;border-color:#2e9d57}
.pbtn.wrong{background:#fde1e1;border-color:#d64545}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:13px;color:#555}
.legend span{display:flex;align-items:center;gap:4px}
.dot{width:11px;height:11px;border-radius:3px;border:1px solid #bbb;display:inline-block}
.dot.current{background:#fff;border:2px solid #111}
.dot.correct{background:#dff4e6}
.dot.wrong{background:#fde1e1}
.result{text-align:center}
.score{font-size:42px;font-weight:800;margin:18px 0}
.start-btn,.review-btn{width:100%;background:#111;color:#fff;margin-top:12px}
.small{font-size:14px;color:#666;line-height:1.5}
@media(max-width:520px){
 .container{padding:10px}
 .card{padding:16px;border-radius:15px}
 .header h1{font-size:28px}
 .question{font-size:19px}
 .hindi{font-size:17px}
 .option{font-size:16px}
}

/* PDF / print report — fixed visual design + controlled page fill */
.pdf-report{display:none;background:#fff;color:#10213b;font-family:Arial,Helvetica,sans-serif;padding:0;line-height:1.25;font-size:9.2pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pdf-wrap{width:100%}
.pdf-head{display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:center;margin-bottom:7px}
.pdf-brand{font-size:20pt;font-weight:900;letter-spacing:-.4px;color:#173f73}
.pdf-brand span{color:#c62828}
.pdf-meta{display:inline-block;margin-top:2px;background:#e9f3ff;border-radius:5px;padding:4px 8px;font-size:8.7pt;font-weight:700;color:#193b63}
.pdf-report .pdf-report-title{background:#cfe6ff;border-radius:7px;padding:9px 10px;text-align:center;font-size:12pt;font-weight:900;color:#123b6b}
.pdf-pagebox{background:#123b6b;color:#fff;border-radius:9px;padding:8px;text-align:center;font-size:9pt;font-weight:800}
.pdf-pagebox b{display:block;font-size:14pt}
.pdf-scorebar{display:grid;grid-template-columns:1.15fr 1fr;gap:7px;margin-bottom:7px}
.pdf-legendbox,.pdf-summarybox{border-radius:7px;padding:6px 8px;font-weight:700}
.pdf-legendbox{background:#f1f5f9;border:1px solid #dbe3ec;color:#23344b}
.pdf-summarybox{background:#fff0df;border:1px solid #ffd4a6;text-align:center}

.pdf-question{page-break-inside:avoid;break-inside:avoid;border:1.4px solid #b8d2ee;border-radius:10px;padding:6px 7px;margin:0 0 7px;background:#f8fbff;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pdf-qhead{display:flex;justify-content:space-between;align-items:center;gap:7px;margin:-6px -7px 5px;padding:5px 7px;background:#e5f1ff;border-bottom:1px solid #c2ddf7;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pdf-qnum{background:#173f73;color:#fff;border-radius:7px;padding:3px 8px;font-size:11pt;font-weight:900;white-space:nowrap}
.pdf-topic{background:#d9ecff;color:#173f73;border:1px solid #a9cdef;border-radius:10px;padding:3px 7px;font-size:7.7pt;font-weight:800;white-space:nowrap}
.pdf-qtitle{font-weight:800;font-size:10.2pt;line-height:1.22;margin-bottom:3px;color:#10213b}
.pdf-question .pdf-hi{font-size:9.1pt;line-height:1.25;margin-bottom:4px;color:#17283c}
.pdf-options{display:grid;grid-template-columns:1fr 1fr;gap:3px 5px;margin-top:4px}
.pdf-option{padding:4px 5px;border:1px solid #d5dce5;border-radius:5px;background:#fff;font-size:8.4pt;line-height:1.18;min-height:29px}
.pdf-option.pdf-correct{background:#e5f7eb;border:1.4px solid #2e9d57}
.pdf-option.pdf-user-wrong{background:#fde8e8;border:1.4px solid #d64545}
.pdf-option .mark{display:inline-block;width:15px;height:15px;border-radius:50%;text-align:center;line-height:15px;font-weight:900;margin-right:3px;font-size:8pt}
.pdf-option .mark.green{background:#16824f;color:#fff}.pdf-option .mark.red{background:#d62f2f;color:#fff}
.pdf-status{font-weight:800;margin-top:4px;padding:4px 6px;border-radius:5px;font-size:8.3pt}
.pdf-status.correct{background:#dcf4e4;color:#087441}.pdf-status.wrong{background:#fde1e1;color:#b51f1f}.pdf-status.unanswered{background:#f1f3f5;color:#4b5563}
.pdf-expl{margin-top:4px;background:#eef6ff;border-left:3px solid #2386d7;border-radius:4px;padding:4px 6px;font-size:8.1pt;line-height:1.2;color:#17283c}
.pdf-expl .en{margin-bottom:3px}.pdf-expl .hi{font-size:8.15pt}
.pdf-footer{text-align:center;color:#667085;font-size:7.5pt;margin-top:4px}

.pdf-page{box-sizing:border-box;width:100%;height:283mm;position:relative;overflow:hidden;break-after:page;page-break-after:always}
.pdf-page:last-child{break-after:auto;page-break-after:auto}
.pdf-page-content{width:100%}
.pdf-page-cards{width:100%}
.pdf-page-footer{position:absolute;left:0;right:0;bottom:0;text-align:center;color:#667085;font-size:7.5pt;padding-top:3px}


/* PDF QUESTION STATUS COLORS — exactly three card colours */
.pdf-report .pdf-question.status-correct{background:#e8f7ed !important;border-color:#a8d9bb !important}
.pdf-report .pdf-question.status-correct .pdf-qhead{background:#e8f7ed !important;border-bottom-color:#a8d9bb !important}
.pdf-report .pdf-question.status-correct .pdf-topic{background:#e8f7ed !important;color:#087441 !important;border-color:#a8d9bb !important}
.pdf-report .pdf-question.status-wrong{background:#fdeaea !important;border-color:#e58b8b !important}
.pdf-report .pdf-question.status-wrong .pdf-qhead{background:#fdeaea !important;border-bottom-color:#e58b8b !important}
.pdf-report .pdf-question.status-wrong .pdf-topic{background:#fdeaea !important;color:#b51f1f !important;border-color:#e58b8b !important}
.pdf-report .pdf-question.status-unanswered{background:#eaf3ff !important;border-color:#b8d2ee !important}
.pdf-report .pdf-question.status-unanswered .pdf-qhead{background:#eaf3ff !important;border-bottom-color:#b8d2ee !important}
.pdf-report .pdf-question.status-unanswered .pdf-topic{background:#eaf3ff !important;color:#173f73 !important;border-color:#b8d2ee !important}

@media print{
 body{background:#fff!important}
 .container{display:none!important}
 .pdf-report{display:block!important}
 @page{size:A4 portrait;margin:7mm}
 .pdf-question{page-break-inside:avoid;break-inside:avoid}
}
button:disabled{opacity:.55;cursor:default}
@media print{.pdf-report{font-size:9pt}}
</style>
</head>
<body>
<div class="container">
<div class="card">
<div id="home">
<div class="header">
<h1 id="quizTitle">📚 Quiz</h1>
<div class="subtitle" id="quizSubtitle">Loading quiz…</div>
</div>
<p id="homeText">Answer the questions at your own pace. Your progress is saved automatically on this browser.</p>
<button id="startBtn" class="start-btn" onclick="startQuiz()">START QUIZ</button>
<button id="resumeBtn" class="review-btn hidden" onclick="resumeQuiz()">RESUME QUIZ</button>
<button id="reviewHomeBtn" class="review-btn hidden" onclick="openReview()">VIEW SOLUTIONS</button>
</div>

<div id="quiz" class="hidden">
<div class="progress" id="progress"></div>
<div class="question" id="question"></div>
<div class="hindi" id="questionHi"></div>
<div id="options"></div>
<div id="feedback" class="feedback hidden"></div>

<div class="palette-title">Question Palette</div>
<div id="palette" class="palette"></div>
<div class="legend">
<span><i class="dot current"></i> Current</span>
<span><i class="dot correct"></i> Correct</span>
<span><i class="dot wrong"></i> Wrong</span>
</div>

<div class="nav">
<button class="prev" onclick="previousQuestion()">◀ Previous</button>
<button class="next" onclick="nextQuestion()">Next ▶</button>
</div>

</div>

<div id="result" class="hidden result">
<div class="header">
<h1>🎯 Quiz Result</h1>
</div>
<div class="score" id="score"></div>
<p id="resultText"></p>
<button class="review-btn" onclick="openReview()">VIEW SOLUTIONS</button>
<button class="review-btn pdf-btn" onclick="downloadPDF()">DOWNLOAD PDF</button>
<p class="small">The PDF contains all questions, your answers, correct answers and explanations.</p>
</div>
</div>
</div>

<div id="pdfReport" class="pdf-report"></div>

<script>
let quizId = "";
let quizDate = "";
let quizTitle = "";
let quizSubject = "";
let quizLanguages = [];
let questions = [];
let current = 0;
let answers = [];
let completed = false;
let reviewMode = false;

function esc(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function getOptionText(q, i){
  return Array.isArray(q.o) && q.o[i] !== undefined ? q.o[i] : "";
}

function labelForIndex(i){
  return i < 26 ? String.fromCharCode(65+i) : String(i+1);
}

function languageLine(data){
  if (Array.isArray(data.languages) && data.languages.length) return data.languages.join(" + ");
  const hasHindi = questions.some(q => q.hi);
  return hasHindi ? "English + Hindi" : "English";
}

async function loadQuiz(){
  try{
    const params = new URLSearchParams(location.search);
    const requested = params.get("date");
    const today = new Date();
    const localDate =
      today.getFullYear()+"-"+
      String(today.getMonth()+1).padStart(2,"0")+"-"+
      String(today.getDate()).padStart(2,"0");

    const date = requested && /^\d{4}-\d{2}-\d{2}$/.test(requested)
      ? requested : localDate;

    // Daily quiz data can be kept in the optional /quizzes/ folder.
    // For convenience, also accept a JSON file in the repository root.
    // This makes mobile GitHub uploads easier and keeps the engine flexible.
    let res = await fetch("quizzes/"+date+".json?v="+Date.now(), {cache:"no-store"});
    if(!res.ok){
      res = await fetch(date+".json?v="+Date.now(), {cache:"no-store"});
    }
    if(!res.ok) throw new Error("Quiz not found");

    const data = await res.json();
    questions = Array.isArray(data.questions) ? data.questions : [];
    if(!questions.length) throw new Error("No questions");

    quizId = data.id || ("quiz_"+date.replaceAll("-","_"));
    quizDate = data.date || date;
    quizTitle = data.title || data.subject || "Quiz";
    quizSubject = data.subject || "";
    quizLanguages = Array.isArray(data.languages) ? data.languages : [];

    answers = Array(questions.length).fill(null);

    document.title = quizTitle + " — " + quizDate;
    document.getElementById("quizTitle").textContent = "📚 " + quizTitle;
    document.getElementById("quizSubtitle").textContent =
      quizDate + " • " + questions.length + " Questions" +
      (languageLine(data) ? " • " + languageLine(data) : "");
    const pdfBrandTitle = document.getElementById("pdfBrandTitle");
    if(pdfBrandTitle) pdfBrandTitle.textContent = quizTitle;

    const desc = data.description || "Answer the questions at your own pace. Your progress is saved automatically on this browser.";
    document.getElementById("homeText").textContent = desc;

    document.getElementById("startBtn").disabled = false;
    init();
  }catch(err){
    document.getElementById("homeText").textContent =
      "This quiz is temporarily unavailable. Please check the quiz link or try again later.";
    document.getElementById("startBtn").disabled = true;
  }
}

function getSaved(){
  try { return JSON.parse(localStorage.getItem(quizId)); }
  catch(e) { return null; }
}

function saveProgress(){
  try{
    localStorage.setItem(quizId, JSON.stringify({
      answers, current, completed,
      score: completed ? calculateScore() : null,
      updatedAt: new Date().toISOString()
    }));
  }catch(e){}
}

function calculateScore(){
  return answers.reduce((n,a,i) =>
    n + (a !== null && a === questions[i].a ? 1 : 0), 0);
}

function startQuiz(){
  const saved = getSaved();
  if(saved && saved.completed){ openReview(); return; }

  answers = saved && Array.isArray(saved.answers) &&
            saved.answers.length === questions.length
    ? saved.answers : Array(questions.length).fill(null);

  current = saved && Number.isInteger(saved.current)
    ? Math.min(Math.max(saved.current,0), questions.length-1) : 0;

  completed = false;
  reviewMode = false;
  document.getElementById("home").classList.add("hidden");
  document.getElementById("result").classList.add("hidden");
  document.getElementById("quiz").classList.remove("hidden");
  render();
}

function resumeQuiz(){ startQuiz(); }

function render(){
  const x = questions[current];
  document.getElementById("progress").textContent =
    `Question ${current+1} / ${questions.length}`;

  document.getElementById("question").textContent = x.q || "";
  const hi = document.getElementById("questionHi");
  hi.textContent = x.hi || "";
  hi.classList.toggle("hidden", !x.hi);

  const box = document.getElementById("options");
  box.innerHTML = "";

  (Array.isArray(x.o) ? x.o : []).forEach((text,i) => {
    const b = document.createElement("button");
    b.className = "option";
    b.textContent = labelForIndex(i) + ". " + text;

    if(answers[current] !== null){
      b.classList.add("disabled");
      if(i === x.a) b.classList.add("correct");
      if(i === answers[current] && i !== x.a) b.classList.add("wrong");
    }
    b.onclick = () => choose(i);
    box.appendChild(b);
  });

  const f = document.getElementById("feedback");
  if(answers[current] !== null){
    f.classList.remove("hidden","correct","wrong");
    const exp = x.e || "";
    const expHi = x.eh || "";
    const expBlock = expHi ? `<br><br>${esc(expHi)}` : "";

    if(answers[current] === x.a){
      f.classList.add("correct");
      f.innerHTML =
        `<div class="feedback-title">✅ Correct!</div>` +
        (exp ? `<b>Explanation:</b> ${esc(exp)}` : "") + expBlock;
    }else{
      f.classList.add("wrong");
      f.innerHTML =
        `<div class="feedback-title">❌ Wrong!</div>` +
        `<b>Correct answer:</b> ${esc(labelForIndex(x.a))}. ${esc(getOptionText(x,x.a))}` +
        (exp ? `<br><br><b>Explanation:</b> ${esc(exp)}` : "") + expBlock;
    }
  }else{
    f.classList.add("hidden");
  }

  buildPalette();

  const prev = document.querySelector(".prev");
  prev.disabled = current === 0;
  prev.style.opacity = current === 0 ? ".5" : "1";
  document.querySelector(".next").textContent =
    current === questions.length-1 ? "Finish ▶" : "Next ▶";
}

function choose(i){
  if(reviewMode || answers[current] !== null) return;

  answers[current] = i;
  saveProgress();

  if(current === questions.length-1){
    completed = true;
    saveProgress();
    showResult();
    return;
  }
  render();
}

function previousQuestion(){
  if(current > 0){
    current--;
    saveProgress();
    render();
  }
}

function nextQuestion(){
  if(current < questions.length-1){
    current++;
    saveProgress();
    render();
  }else{
    completed = true;
    saveProgress();
    showResult();
  }
}

function jump(i){
  current = i;
  saveProgress();
  render();
}

function buildPalette(){
  const p = document.getElementById("palette");
  p.innerHTML = "";
  questions.forEach((q,i)=>{
    const b = document.createElement("button");
    b.className = "pbtn";
    b.textContent = i+1;
    if(i === current) b.classList.add("current");

    if(answers[i] !== null){
      if(answers[i] === q.a) b.classList.add("correct");
      else b.classList.add("wrong");
    }
    b.onclick = () => jump(i);
    p.appendChild(b);
  });
}

function showResult(){
  const score = calculateScore();
  const wrong = answers.reduce((n,a,i) =>
    n + (a !== null && a !== questions[i].a ? 1 : 0), 0);
  const unanswered = answers.filter(a => a === null).length;

  document.getElementById("quiz").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");
  document.getElementById("score").textContent =
    `${score} / ${questions.length}`;
  document.getElementById("resultText").innerHTML =
    `Correct: <b>${score}</b> &nbsp;|&nbsp; Wrong: <b>${wrong}</b> &nbsp;|&nbsp; Unanswered: <b>${unanswered}</b><br><br>` +
    `Your attempt is complete on this browser.`;
}

function openReview(){
  const saved = getSaved();
  if(!saved || !saved.completed){ startQuiz(); return; }

  answers = Array.isArray(saved.answers) &&
            saved.answers.length === questions.length
    ? saved.answers : Array(questions.length).fill(null);
  current = 0;
  completed = true;
  reviewMode = true;

  document.getElementById("home").classList.add("hidden");
  document.getElementById("result").classList.add("hidden");
  document.getElementById("quiz").classList.remove("hidden");
  render();
}

function scalePDFCard(card, s){
  const px = v => (v*s).toFixed(2) + "px";
  const pt = v => (v*s).toFixed(2) + "pt";
  card.style.padding = `${px(6)} ${px(7)}`;
  card.style.marginBottom = px(7);

  const head = card.querySelector('.pdf-qhead');
  if(head){
    head.style.gap = px(7);
    head.style.margin = `${px(-6)} ${px(-7)} ${px(5)}`;
    head.style.padding = `${px(5)} ${px(7)}`;
  }
  const num = card.querySelector('.pdf-qnum');
  if(num){ num.style.padding = `${px(3)} ${px(8)}`; num.style.fontSize = pt(11); }
  const topic = card.querySelector('.pdf-topic');
  if(topic){ topic.style.padding = `${px(3)} ${px(7)}`; topic.style.fontSize = pt(7.7); }
  const title = card.querySelector('.pdf-qtitle');
  if(title){ title.style.fontSize = pt(10.2); title.style.marginBottom = px(3); }
  const hi = card.querySelector('.pdf-hi');
  if(hi){ hi.style.fontSize = pt(9.1); hi.style.marginBottom = px(4); }
  const options = card.querySelector('.pdf-options');
  if(options){ options.style.gap = `${px(3)} ${px(5)}`; options.style.marginTop = px(4); }
  card.querySelectorAll('.pdf-option').forEach(o=>{
    o.style.padding = `${px(4)} ${px(5)}`;
    o.style.fontSize = pt(8.4);
    o.style.minHeight = px(29);
  });
  card.querySelectorAll('.pdf-option .mark').forEach(m=>{
    m.style.width = px(15); m.style.height = px(15); m.style.lineHeight = px(15);
    m.style.marginRight = px(3); m.style.fontSize = pt(8);
  });
  const status = card.querySelector('.pdf-status');
  if(status){ status.style.marginTop = px(4); status.style.padding = `${px(4)} ${px(6)}`; status.style.fontSize = pt(8.3); }
  const expl = card.querySelector('.pdf-expl');
  if(expl){ expl.style.marginTop = px(4); expl.style.padding = `${px(4)} ${px(6)}`; expl.style.fontSize = pt(8.1); }
  const en = card.querySelector('.pdf-expl .en');
  if(en){ en.style.marginBottom = px(3); }
  const ehi = card.querySelector('.pdf-expl .hi');
  if(ehi){ ehi.style.fontSize = pt(8.15); }
}

function buildPDFReport(){
  const score = calculateScore();
  const wrong = answers.reduce((n,a,i) => n + (a !== null && a !== questions[i].a ? 1 : 0), 0);
  const unanswered = answers.filter(a => a === null).length;

  // PDF question cards use exactly three status colours:
  // correctly attempted = green, wrong = red, unattempted = blue.
  const statusColors = {
    correct: ["#e7f7ed", "#087441", "#a8d9bb"],
    wrong: ["#fdeaea", "#b51f1f", "#e58b8b"],
    unanswered: ["#e5f1ff", "#173f73", "#b8d2ee"]
  };

  const head = `<div class="pdf-head">
    <div>
      <div class="pdf-brand">📚 SSC Pioneer — <span>${esc(quizTitle)}</span></div>
      <div class="pdf-meta">${esc(quizDate)} &nbsp; | &nbsp; ${questions.length} Questions &nbsp; | &nbsp; ${esc(quizLanguages.length ? quizLanguages.join(" + ") : (questions.some(q=>q.hi) ? "English + Hindi" : "English"))}</div>
    </div>
    <div class="pdf-report-title">Solutions &amp;<br>Performance Report</div>
  </div>`;

  const scorebar = `<div class="pdf-scorebar">
    <div class="pdf-legendbox">🟢 Correctly attempted &nbsp; | &nbsp; 🔴 Wrong &nbsp; | &nbsp; 🔵 Not attempted</div>
    <div class="pdf-summarybox"><b>Score: ${score} / ${questions.length}</b><br>Correct: ${score} &nbsp; | &nbsp; Wrong: ${wrong} &nbsp; | &nbsp; Unanswered: ${unanswered}</div>
  </div>`;

  const cards = questions.map((x,i)=>{
    const ua = answers[i];
    const status = ua === null ? "⚪ Not Answered" : (ua === x.a ? "🟢 Correct" : "🔴 Wrong");
    const statusClass = ua === null ? "unanswered" : (ua === x.a ? "correct" : "wrong");
    const pal = statusColors[statusClass];
    const opts = (Array.isArray(x.o) ? x.o : []).map((text,j)=>{
      const isCorrect = j === x.a;
      const isWrong = ua !== null && ua !== x.a && j === ua;
      const cls = "pdf-option" + (isCorrect ? " pdf-correct" : "") + (isWrong ? " pdf-user-wrong" : "");
      const mark = isCorrect ? `<span class="mark green">✓</span>` : (isWrong ? `<span class="mark red">×</span>` : "");
      return `<div class="${cls}">${mark}<b>${esc(labelForIndex(j))}.</b> ${esc(text)}</div>`;
    }).join("");
    const your = ua === null ? "Not answered" : `${labelForIndex(ua)}. ${getOptionText(x,ua)}`;
    const correct = `${labelForIndex(x.a)}. ${getOptionText(x,x.a)}`;
    const cardBg = pal[0];
    const cardBorder = pal[2];
    return `<section class="pdf-question status-${statusClass}" style="border-color:${cardBorder};background:${cardBg}">
      <div class="pdf-qhead" style="background:${pal[0]};border-bottom-color:${pal[2]}">
        <span class="pdf-qnum" style="background:${pal[1]}">Q${i+1}</span>
        <span class="pdf-topic" style="background:${pal[0]};color:${pal[1]};border-color:${pal[2]}">Topic: ${esc(x.topic || quizSubject || "General")}</span>
      </div>
      <div class="pdf-qtitle">${esc(x.q || "")}</div>
      ${x.hi ? `<div class="pdf-hi" lang="hi">${esc(x.hi)}</div>` : ""}
      <div class="pdf-options">${opts}</div>
      <div class="pdf-status ${statusClass}">${status} &nbsp; | &nbsp; <b>Your Answer:</b> ${esc(your)} &nbsp; | &nbsp; <b>Correct Answer:</b> ${esc(correct)}</div>
      ${(x.e || x.eh) ? `<div class="pdf-expl">${x.e ? `<div class="en">📘 <b>Explanation:</b> ${esc(x.e)}</div>` : ""}${x.eh ? `<div class="hi" lang="hi">🔍 <b>व्याख्या:</b> ${esc(x.eh)}</div>` : ""}</div>` : ""}
    </section>`;
  });

  const root = document.getElementById("pdfReport");
  root.innerHTML = `<div class="pdf-wrap"></div>`;
  root.style.display = "block";
  root.style.width = "196mm";
  const wrap = root.firstElementChild;

  // Use the actual A4 print-content height (297mm minus 7mm top/bottom @page margins).
  // Grouping is decided at natural card size first; scaling happens only afterwards.
  const pageHeight = 283 * 3.779527559;
  const footerReserve = 14;
  const pages = [];
  let pageIndex = 0;
  let page = null;
  let content = null;
  let cardsOnPage = [];
  let firstFixedHeight = 0;

  function makePage(first){
    page = document.createElement("div");
    page.className = "pdf-page";
    content = document.createElement("div");
    content.className = first ? "pdf-page-content" : "pdf-page-cards";
    page.appendChild(content);
    wrap.appendChild(page);
    pages.push(page);
    cardsOnPage = [];
    if(first){ content.innerHTML = head + scorebar; firstFixedHeight = content.scrollHeight; }
    pageIndex++;
    return page;
  }

  makePage(true);

  cards.forEach(cardHTML=>{
    const holder = document.createElement("div");
    holder.innerHTML = cardHTML;
    const card = holder.firstElementChild;
    scalePDFCard(card, 1);
    content.appendChild(card);

    const limit = pageHeight - footerReserve - (pageIndex === 1 ? firstFixedHeight : 0);
    const cardUsed = content.scrollHeight - (pageIndex === 1 ? firstFixedHeight : 0);
    const fits = cardUsed <= limit + 1;

    if(!fits && cardsOnPage.length){
      content.removeChild(card);
      makePage(false);
      content.appendChild(card);
      cardsOnPage.push(card);
    }else{
      cardsOnPage.push(card);
    }
  });

  // Fill genuine unused space by enlarging the card's typography, padding,
  // option controls and explanation spacing together. This makes the content
  // itself grow with the card instead of producing a stretched empty box.
  pages.forEach((pg, idx)=>{
    const holder = pg.querySelector(".pdf-page-content, .pdf-page-cards");
    const pageCards = Array.from(pg.querySelectorAll(".pdf-question"));
    if(!holder || !pageCards.length) return;

    const fixedHeight = idx === 0
      ? Array.from(holder.children).filter(el => !el.classList.contains("pdf-question"))
          .reduce((n,el)=>n + el.getBoundingClientRect().height,0)
      : 0;
    const available = Math.max(0, pageHeight - footerReserve - fixedHeight);
    const natural = pageCards.reduce((n,c)=>n + c.getBoundingClientRect().height + parseFloat(getComputedStyle(c).marginBottom || 0),0);
    const spare = Math.max(0, available - natural);

    // Only pages with meaningful spare room are enlarged. The scale is capped
    // so text remains comfortable and the original visual hierarchy is kept.
    if(spare < 35) return;

    let lo = 1, hi = 1.28;
    for(let k=0;k<12;k++){
      const mid = (lo + hi) / 2;
      pageCards.forEach(c=>scalePDFCard(c, mid));
      const used = pageCards.reduce((n,c)=>n + c.getBoundingClientRect().height + parseFloat(getComputedStyle(c).marginBottom || 0),0);
      if(used <= available) lo = mid;
      else hi = mid;
    }
    const finalScale = Math.max(1, Math.min(1.28, lo));
    pageCards.forEach(c=>scalePDFCard(c, finalScale));
  });

  // Keep the existing simple footer only on the final PDF page.
  const last = pages[pages.length - 1];
  if(last){
    const footer = document.createElement("div");
    footer.className = "pdf-page-footer";
    footer.innerHTML = `SSC Pioneer • ${esc(quizTitle)} • Solutions &amp; Performance Report`;
    last.appendChild(footer);
  }

  root.style.display = "";
  root.style.width = "";
}

function downloadPDF(){
  if(!completed) return;
  buildPDFReport();
  document.body.classList.add("printing");
  setTimeout(()=>{
    window.print();
    setTimeout(()=>document.body.classList.remove("printing"),500);
  },50);
}

function init(){
  const saved = getSaved();

  if(saved && saved.completed){
    document.getElementById("startBtn").classList.add("hidden");
    document.getElementById("resumeBtn").classList.add("hidden");
    document.getElementById("reviewHomeBtn").classList.remove("hidden");
    document.getElementById("homeText").textContent =
      "This quiz has already been completed on this browser. You cannot reattempt it here; you can view all questions, answers and explanations.";
  }else if(saved && Array.isArray(saved.answers) &&
           saved.answers.some(a => a !== null)){
    document.getElementById("startBtn").classList.add("hidden");
    document.getElementById("resumeBtn").classList.remove("hidden");
    document.getElementById("homeText").textContent =
      "You have an unfinished attempt on this browser. Your progress is saved automatically.";
  }
}

loadQuiz();
</script>
